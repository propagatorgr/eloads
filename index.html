<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Ηλεκτρική Ταλάντωση</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
body {
  margin: 0;
  background: #ddd;
  font-family: Arial;
}
#sliders {
  display: flex;
  gap: 40px;        /* απόσταση μεταξύ sliders ✅ */
  align-items: center;
  flex-wrap: wrap;  /* αν μικρύνει η οθόνη ✅ */
}

.sliderBlock {
  display: flex;
  align-items: center;
  gap: 10px;        /* απόσταση label–slider–value ✅ */
}
#controls {
  padding: 10px;
  background: #ccc;
}
</style>
</head>

<body>

<div id="canvasContainer"></div>

<div id="controls">
  <button onclick="startSim()">START</button>
  <button onclick="resumeSim()">RESUME</button>
  <button onclick="resetSim()">RESET</button>
   <input type="checkbox" id="forcesCheckbox">
    Εμφάνιση δυνάμεων
  </label>
<br>
</div>
<div id="sliders">

  <div class="sliderBlock">
    Q (μC):
    <input type="range" id="Qslider" min="1" max="10" step="0.5" value="2">
    <span id="Qval">2</span>
    <br>
  </div>

  <div class="sliderBlock">
    q (μC):
    <input type="range" id="qslider" min="5" max="50" step="1" value="20">
    <span id="qval">20</span>
  </div>

  <div class="sliderBlock">
    m (kg):
    <input type="range" id="mslider" min="0.05" max="0.5" step="0.01" value="0.1">
    <span id="mval">0.1</span>
  </div>

</div>

<script src="sketch.js"></script>

</body>
</html>
