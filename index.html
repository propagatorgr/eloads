<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Ηλεκτρική Ταλάντωση</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
body {
  margin: 0;
  background: #ddd;
  font-family: Arial;
}

/* ✅ FIX ΓΙΑ ΟΛΕΣ ΤΙΣ ΑΝΑΛΥΣΕΙΣ (ΟΧΙ ΜΟΝΟ MOBILE) */
.valBox {
  display: inline-block;
  width: 45px;
  text-align: right;
  font-weight: bold;
}

/* ===== DESKTOP ===== */
#sliders {
  display: flex;
  justify-content: center;
  gap: 40px;
  align-items: center;
  flex-wrap: wrap;
  padding: 0 30px;
}

.sliderBlock {
  display: flex;
  align-items: center;
  gap: 10px;
}

#controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 20px;
}

#legendInline {
  margin-left: 20px;
  font-size: 14px;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

  #controls {
    flex-direction: column;
    align-items: stretch;
    padding: 12px 15px;
    gap: 10px;
  }

  #controls button {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border-radius: 6px;
  }

  #controls label {
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #controls input[type="checkbox"] {
    transform: scale(1.3);
  }

  #legendInline {
    margin-left: 0;
    font-size: 14px;
    line-height: 1.4;
  }

  #sliders {
    flex-direction: column;
    align-items: stretch;
    gap: 18px;
    padding: 10px 15px;
  }

  .sliderBlock {
    flex-direction: column;
    gap: 6px;
  }

  .sliderBlock input[type="range"] {
    width: 100%;
    height: 30px;
  }

  /* ✅ το κρατάμε και εδώ για σιγουριά */
  .valBox {
    width: 50px;
    font-size: 15px;
  }
}

</style>
</head>

<body>

<div id="canvasContainer"></div>

<div id="controls">
  <button onclick="startSim()">Ξεκίνα</button>
  <button onclick="resumeSim()">Μέχρι άκρο</button>
  <button onclick="resetSim()">Επανεκκίνηση</button>

  <label style="margin-left:10px;">
    <input type="checkbox" id="forcesCheckbox">
    Δυνάμεις
  </label>

  <div id="legendInline">
    <span><b>F:</b></span>
    <span style="color:green">Fc</span>
    <span style="color:orange">w</span>

    <span style="margin-left:15px;"><b>Q:</b></span>
    <span style="color:red">Q</span>
    <span style="color:blue">q</span>
  </div>
</div>

<div id="sliders">

  <div class="sliderBlock">
    Q (μC):
    <input type="range" id="Qslider" min="1" max="10" step="0.5" value="2">
    <span id="Qval" class="valBox">2</span>
  </div>

  <div class="sliderBlock">
    q (μC):
    <input type="range" id="qslider" min="5" max="50" step="1" value="20">
    <span id="qval" class="valBox">20</span>
  </div>

  <div class="sliderBlock">
    m (kg):
    <input type="range" id="mslider" min="0.05" max="0.5" step="0.01" value="0.1">
    <span id="mval" class="valBox">0.1</span>
  </div>

</div>

<script src="sketch.js"></script>

</body>
</html>
