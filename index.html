<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Ηλεκτρική Ταλάντωση</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<style>
body {
  margin: 0;
  background: #ddd;
  font-family: Arial;
}

#controls {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 10px 20px;
}

#scenarioRow {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-left: 20px;
}

/* τιμές δεξιά */
#values {
  margin-left: 20px;
  font-weight: bold;
}

select {
  padding: 5px;
}
</style>

</head>

<body>

<div id="canvasContainer"></div>

<div id="controls">

  <button onclick="startSim()">Ξεκίνα</button>
  <button onclick="resumeSim()">Μέχρι άκρο</button>
  <button onclick="resetSim()">Επανεκκίνηση</button>

  <label>
    <input type="checkbox" id="forcesCheckbox">
    Δυνάμεις
  </label>

  <div id="scenarioRow">
    Σενάριο:
    <select id="scenarioSelect" onchange="applyScenario()">
      <option value="base">Βασική ταλάντωση</option>
      <option value="equilibrium">Ισορροπία</option>
      <option value="small">Μικρή ταλάντωση</option>
      <option value="large">Μεγάλη ταλάντωση</option>
    </select>

    <div id="values">
      Q=2 μC | q=20 μC | m=0.10 kg | d=0.30 m
    </div>
  </div>

</div>

<script src="sketch.js"></script>

</body>
</html>
